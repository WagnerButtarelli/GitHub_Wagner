<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Voz</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif;background:#f4f5fb;color:#1c1e33;text-align:center;padding:20px}
@media(prefers-color-scheme:dark){body{background:#0e0f1f;color:#eceefe}}
#mic{width:120px;height:120px;border-radius:50%;border:0;font-size:3rem;background:#4f46e5;color:#fff;cursor:pointer}
#mic.on{animation:p 1.2s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(99,102,241,.6)}100%{box-shadow:0 0 0 34px rgba(99,102,241,0)}}
#t{font-size:1.2rem;font-weight:600;min-height:3em;max-width:420px;word-break:break-word}#s{opacity:.7}
</style></head><body>
<button id="mic">🎤</button><div id="t"></div><div id="s">Toque no microfone e fale</div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const send=o=>{try{window.opener&&window.opener.postMessage(Object.assign({type:'voz'},o),'*')}catch(e){}};
const $=s=>document.querySelector(s);let rec=null,txt='',on=false;
if(!SR){$('#s').textContent='Este navegador não suporta reconhecimento de voz. Feche e digite a anotação.';$('#mic').disabled=true}
function start(){
  rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=false;txt='';
  rec.onstart=()=>{on=true;$('#mic').classList.add('on');$('#s').textContent='Ouvindo…'};
  rec.onresult=e=>{let f='',i2='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=r[0].transcript+' ';else i2+=r[0].transcript}
    txt=(f+i2).trim();$('#t').textContent=txt;send({text:txt,final:false})};
  rec.onerror=e=>{$('#s').textContent=e.error==='not-allowed'?'Permita o microfone nesta janela e toque de novo.':'Erro: '+e.error};
  rec.onend=()=>{on=false;$('#mic').classList.remove('on');
    if(txt){send({text:txt,final:true});$('#s').textContent='Enviado ✓';setTimeout(()=>window.close(),350)}
    else if($('#s').textContent==='Ouvindo…')$('#s').textContent='Não ouvi nada. Toque para tentar de novo.'};
  try{rec.start()}catch(e){}
}
$('#mic').onclick=()=>{if(on)rec.stop();else start()};
if(SR)try{start()}catch(e){}
window.addEventListener('beforeunload',()=>{if(!txt)send({cancel:true})});
</script></body></html>
